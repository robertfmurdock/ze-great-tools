name: Collect contribution data

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contribution-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Collect current contribution data
        run: ./gradlew currentContributionData
      - uses: actions/upload-artifact@v7
        with:
          name: digger-contribution-data
          path: build/digger/current.json
