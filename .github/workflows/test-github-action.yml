name: Test Tagger GitHub Action
on:
  push:
    branches: ['**']
    paths:
      - action.yml
      - .github/workflows/test-github-action.yml
  pull_request:
    paths:
      - action.yml
      - .github/workflows/test-github-action.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calculate-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: tagger
        uses: ./
        with:
          force-snapshot: true
      - name: Verify outputs are available to following steps
        env:
          TAGGER_VERSION: ${{ steps.tagger.outputs.version }}
          TAGGER_SNAPSHOT: ${{ steps.tagger.outputs.snapshot }}
        run: |
          test -n "$TAGGER_VERSION"
          test "$TAGGER_SNAPSHOT" = true
          echo "Tagger produced $TAGGER_VERSION (snapshot=$TAGGER_SNAPSHOT)"
