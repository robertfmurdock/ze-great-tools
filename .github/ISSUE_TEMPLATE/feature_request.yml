name: Feature request
description: Suggest an improvement to ze-great-tools
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Thank you for suggesting an improvement.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the need or difficulty behind your suggestion.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: Describe the behavior or solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Share any alternatives or workarounds you have considered.
    validations:
      required: false
