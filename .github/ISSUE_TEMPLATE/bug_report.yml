name: Bug report
description: Report a problem with ze-great-tools
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thank you for taking the time to report a problem.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the command, configuration, or smallest example that reproduces the problem.
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the affected tool or module, version, operating system, and relevant Java or Gradle versions.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Add relevant error messages or logs. Remove secrets and private data before posting.
      render: text
    validations:
      required: false
